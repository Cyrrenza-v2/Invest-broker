name: Invest Broker CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test route contracts
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Verify user/admin installable app output
        run: |
          test -s dist/index.html
          test -s dist/admin.html
          test -s dist/user.webmanifest
          test -s dist/admin.webmanifest
          test -s dist/sw.js
          test -s dist/icon.svg