name: Verify Invest Broker portals for Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invest-broker-pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-portals:
    name: Build, test, audit, and smoke-test both portals
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run Worker tests
        run: npm run test:worker

      - name: Build customer portal
        env:
          VITE_APP_ROLE: user
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          test -s dist/index.html
          cp -R dist dist-user

      - name: Build admin portal
        env:
          VITE_APP_ROLE: admin
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          test -s dist/index.html
          cp -R dist dist-admin

      # Pages Git integration deploys main. These checks confirm that the stable
      # project URLs return HTML; authenticated user journeys require test users
      # and are not implied by an HTTP 200 response.
      - name: Smoke-test customer Pages URL
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 https://invest-broker-user.pages.dev/ -o customer.html
          grep -Eiq '<html|<!doctype html' customer.html
          grep -Eiq '<title|id="app"|id="root"' customer.html

      - name: Smoke-test admin Pages URL
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 https://invest-broker-admin.pages.dev/ -o admin.html
          grep -Eiq '<html|<!doctype html' admin.html
          grep -Eiq '<title|id="app"|id="root"' admin.html
