name: Verify Invest Broker portals for Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invest-broker-pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-portals:
    name: Build and smoke-test both portals
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build customer portal
        env:
          VITE_APP_ROLE: user
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          mv dist dist-user

      - name: Build admin portal
        env:
          VITE_APP_ROLE: admin
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          mv dist dist-admin

      # Verify the generated static frontends locally. Public URL probes are
      # intentionally excluded: Pages projects/domains are not yet confirmed.
      - name: Smoke-test customer portal build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-user/index.html
          test -s dist-user/assets/$(find dist-user/assets -maxdepth 1 -type f -name '*.js' -printf '%f\n' | head -n 1)
          grep -q 'Invest Broker' dist-user/index.html

      - name: Smoke-test admin portal build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-admin/index.html
          test -s dist-admin/assets/$(find dist-admin/assets -maxdepth 1 -type f -name '*.js' -printf '%f\n' | head -n 1)
          grep -q 'Invest Broker' dist-admin/index.html
