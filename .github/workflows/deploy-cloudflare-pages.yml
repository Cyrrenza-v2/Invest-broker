name: Verify Invest Broker portals for Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invest-broker-pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-portals:
    name: Build and smoke-test both portals
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build customer portal
        env:
          VITE_APP_ROLE: user
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder
          VITE_CAPTCHA_PROVIDER: turnstile
          VITE_CAPTCHA_SITE_KEY: ci-build-placeholder
        run: |
          set -eu
          npm run build
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) | grep -q .
          mv dist dist-user

      - name: Build admin portal
        env:
          VITE_APP_ROLE: admin
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder
          VITE_CAPTCHA_PROVIDER: turnstile
          VITE_CAPTCHA_SITE_KEY: ci-build-placeholder
        run: |
          set -eu
          npm run build
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) | grep -q .
          mv dist dist-admin

      # These are deterministic artifact smoke tests. Production DNS/reachability
      # is checked separately because it must not make pull-request CI flaky.
      - name: Smoke-test customer portal artifact
        run: |
          set -eu
          grep -q '<div id="app"></div>' dist-user/index.html
          test "$(find dist-user/assets -maxdepth 1 -type f -name '*.js' | wc -l)" -gt 0

      - name: Smoke-test admin portal artifact
        run: |
          set -eu
          grep -q '<div id="app"></div>' dist-admin/index.html
          test "$(find dist-admin/assets -maxdepth 1 -type f -name '*.js' | wc -l)" -gt 0
