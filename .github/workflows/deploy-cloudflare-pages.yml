name: Verify Invest Broker portals for Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invest-broker-pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-portals:
    name: Build and smoke-test both portals
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build customer portal
        env:
          VITE_APP_ROLE: user
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          mv dist dist-user

      - name: Build admin portal
        env:
          VITE_APP_ROLE: admin
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          mv dist dist-admin

      # Test built artifacts locally. Live URL checks belong to a separate
      # deployment smoke test because Pages custom domains may not be configured yet.
      - name: Smoke-test customer portal build artifact
        run: |
          test -s dist-user/index.html
          grep -R -q "Wallet and trading flow" dist-user/assets
          grep -R -q "SIMULATED" dist-user/assets

      - name: Smoke-test admin portal build artifact
        run: |
          test -s dist-admin/index.html
          grep -R -q "Sandbox market" dist-admin/assets
          grep -R -q "SIMULATED" dist-admin/assets
