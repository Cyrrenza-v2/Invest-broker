name: Verify Invest Broker portals for Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invest-broker-pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-portals:
    name: Build and smoke-test both portals
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build customer portal
        env:
          VITE_APP_ROLE: user
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          mv dist dist-user

      - name: Build admin portal
        env:
          VITE_APP_ROLE: admin
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rjgzvpkyccfpnpzlbcuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WRqEfkebSkqEBYhiCSAXRA_Z_jovR3l' }}
        run: |
          npm run build
          mv dist dist-admin

      # Cloudflare Pages' connected Git deployment publishes main automatically.
      # This workflow verifies the same source without requiring duplicate API secrets.
      - name: Verify customer portal is reachable
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://invest-broker-user.pages.dev/ -o /dev/null

      - name: Verify admin portal is reachable
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://invest-broker-admin.pages.dev/ -o /dev/null
