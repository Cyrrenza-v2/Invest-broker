name: Invest Broker Worker CI

on:
  push:
    branches:
      - main
      - feature/cloudflare-durable-object-api
      - feature/separate-portals-pwa
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build frontend and test Worker
    # Pin to the current Ubuntu LTS to avoid unplanned ubuntu-latest image migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build customer portal
        run: npm run build
      - name: Build admin portal
        run: VITE_APP_ROLE=admin npm run build
      - name: Test Worker, SQLite persistence, idempotency, and eviction recovery
        run: npm run test:worker
      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      # A staged Worker with workers_dev:false has no public workers.dev endpoint.
      # Run live probes only when an explicitly configured public test URL exists.
      - name: Verify deployed Worker health and runtime authentication
        if: ${{ vars.WORKER_PUBLIC_URL != '' }}
        env:
          WORKER_URL: ${{ vars.WORKER_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer invalid-ci-probe' "$WORKER_URL/api/v1/summary?accountId=11111111-1111-4111-8111-111111111111")"
          if [[ "$status" != "401" ]]; then
            echo "Protected Worker route returned HTTP $status; expected 401 for an invalid Supabase session." >&2
            exit 1
          fi
          echo "Live Worker health passed and invalid Supabase sessions are rejected (HTTP $status)."
