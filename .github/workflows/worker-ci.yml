name: Invest Broker Worker CI

on:
  push:
    branches:
      - main
      - feature/cloudflare-durable-object-api
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build frontend and test Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build existing frontend
        run: npm run build
      - name: Test Worker, SQLite persistence, idempotency, and eviction recovery
        run: npm run test:worker
      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

  deploy-test-worker:
    name: Deploy and probe test Worker
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Deploy test-only Worker when Cloudflare secrets are configured
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INVEST_BROKER_API_TOKEN: ${{ secrets.INVEST_BROKER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$INVEST_BROKER_API_TOKEN" ]]; then
            echo "Cloudflare deployment skipped: configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and INVEST_BROKER_API_TOKEN repository secrets."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$INVEST_BROKER_API_TOKEN" | npx wrangler secret put API_TOKEN --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          if [[ -z "$url" ]]; then
            echo "Could not find workers.dev URL in Wrangler output."
            exit 1
          fi
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify deployed health endpoint and protected-route gate
        if: steps.deploy.outputs.deployed == 'true'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$WORKER_URL/api/v1/summary?accountId=release-probe")"
          test "$status" = "401"
          echo "Health endpoint passed; protected API rejects unauthenticated access (HTTP $status)."
