name: Deploy Invest Broker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build customer portal
        run: VITE_APP_ROLE=user npx vite build --base=/Invest-broker/ --outDir dist-user

      - name: Build Admin CEO portal
        run: VITE_APP_ROLE=admin npx vite build --base=/Invest-broker/admin/ --outDir dist-admin

      - name: Assemble both portals
        run: |
          mkdir -p dist/admin
          cp -a dist-user/. dist/
          cp -a dist-admin/. dist/admin/
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/assets/$(basename "$(find dist/assets -maxdepth 1 -type f -name '*.js' | head -n 1)")
          echo "Both customer and admin entry points are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
