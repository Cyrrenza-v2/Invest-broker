version: 2.1

jobs:
  test_and_build:
    docker:
      - image: cimg/node:22.0
    working_directory: ~/project
    steps:
      # Use the exact branch CircleCI is building; no SSH key is required for this public repository.
      - run:
          name: Checkout source over HTTPS
          command: |
            set -eu
            branch="${CIRCLE_BRANCH:-main}"
            source_dir="/tmp/invest-broker-source"
            rm -rf "$source_dir"
            git clone --depth 1 --branch "$branch" https://github.com/Cyrrenza-v2/Invest-broker.git "$source_dir"
            test -s "$source_dir/package.json"
            cp -a "$source_dir/." .
            rm -rf "$source_dir"
      - run:
          name: Verify dependency manifest and lockfile
          command: |
            set -eu
            node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (JSON.stringify(p.dependencies||{}) !== JSON.stringify(l.packages[''].dependencies||{}) || JSON.stringify(p.devDependencies||{}) !== JSON.stringify(l.packages[''].devDependencies||{})) { console.error('package.json and package-lock.json root dependencies differ'); process.exit(1); }"
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Dependency security audit
          command: npm audit --audit-level=high
      - run:
          name: Build customer portal
          command: |
            set -eu
            VITE_APP_ROLE=user npm run build
            test -s dist/index.html
            test -d dist/assets
            find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) | grep -q .
            mv dist dist-user
      - run:
          name: Build admin portal
          command: |
            set -eu
            VITE_APP_ROLE=admin npm run build
            test -s dist/index.html
            test -d dist/assets
            find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) | grep -q .
            mv dist dist-admin
      - run:
          name: Test Worker security and ledger behavior
          command: npm run test:worker
      - run:
          name: Validate Wrangler Worker configuration
          command: npx wrangler deploy --dry-run --config wrangler.jsonc

workflows:
  invest_broker_ci:
    jobs:
      - test_and_build
