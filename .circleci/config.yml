version: 2.1

jobs:
build-and-test:
docker:
- image: cimg/node:22.0
steps:
- checkout
- run:
name: Install dependencies
command: npm ci
- run:
name: Run tests
command: npm test
- run:
name: Build application
command: npm run build
- run:
name: Verify production build files
command: |
test -f dist/index.html
test -f dist/admin.html
test -f dist/user.webmanifest
test -f dist/admin.webmanifest
test -f dist/sw.js
test -f dist/icon.svg

workflows:
invest-broker-ci:
jobs:
- build-and-test