version: 2.1

jobs:
  test_and_build:
    docker:
      - image: cimg/node:22.0
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Build web app
          command: npm run build
      - run:
          name: Verify customer and admin installable app output
          command: |
            test -s dist/index.html
            test -s dist/admin.html
            test -s dist/user.webmanifest
            test -s dist/admin.webmanifest
            test -s dist/sw.js
            test -s dist/icon.svg

workflows:
  invest_broker_ci:
    jobs:
      - test_and_build
